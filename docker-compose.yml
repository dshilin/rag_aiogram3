version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_aiogram3_bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/embeddings') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
